name: test / rust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--rust.yaml
      - .config/nextest.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/nextest/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - workflow-scripts/plan-nextest-shards.mjs
  pull_request:
    paths:
      - .github/workflows/test--rust.yaml
      - .config/nextest.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/nextest/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - workflow-scripts/plan-nextest-shards.mjs

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  # renovate: datasource=github-releases depName=nextest-rs/nextest versioning=semver extractVersion=^cargo-nextest-(?<version>.*)$
  NEXTEST_VERSION: "0.9.140"
  # Keep test execution near twice the clean-build cost so extra shards still repay their build overhead.
  NEXTEST_TARGET_SECONDS: "90"
  NEXTEST_FALLBACK_SHARDS: "1"
  NEXTEST_MAX_SHARDS: "4"

jobs:
  plan-test-shards:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plan Rust test shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node workflow-scripts/plan-nextest-shards.mjs

  seed-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: rust-test-main-cache
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Seed Rust test caches
        uses: ./.github/actions/nextest
        with:
          nextest-version: ${{ env.NEXTEST_VERSION }}
          save-cache: true

  test:
    name: test shard ${{ matrix.shard }}
    needs: plan-test-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-test-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Rust tests
        uses: ./.github/actions/nextest
        with:
          nextest-version: ${{ env.NEXTEST_VERSION }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ needs.plan-test-shards.outputs.shard_count }}

  doc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare Cargo dependencies
        uses: ./.github/actions/cargo-dependencies
      - name: Detect Rust doctests
        id: doctests
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --no-deps > cargo-metadata.json
          node <<'NODE'
          const fs = require("node:fs");

          const metadata = JSON.parse(fs.readFileSync("cargo-metadata.json", "utf8"));
          const workspaceMembers = new Set(metadata.workspace_members);
          const hasDocTests = metadata.packages
            .filter((pkg) => workspaceMembers.has(pkg.id))
            .some((pkg) => pkg.targets.some((target) => target.doctest));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_doc_tests=${hasDocTests}\n`);
          NODE
      - name: Run Rust doctests
        if: steps.doctests.outputs.has_doc_tests == 'true'
        run: cargo test --locked --workspace --doc
